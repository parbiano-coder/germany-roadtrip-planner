<script>
(function(){
  var docs = [
    "여권 (유효기간 6개월 이상)",
    "국제운전면허증",
    "한국 운전면허증 원본",
    "여행자보험 가입 확인서",
    "렌터카 예약 확인서",
    "예치금용 신용카드",
    "해외 로밍 유심",
    "멀티 전원 어댑터 (Type F)"
  ];
  var pickup = [
    "차량 외관 사진/영상 촬영",
    "연료 타입 확인 (디젤/가솔린)",
    "연료 정책(Full-to-Full) 확인",
    "삼각대 · 형광조끼 · 구급함 비치 확인",
    "환경 스티커(Umweltplakette) 부착 확인",
    "네비게이션 목적지 한글/영문 병기 입력법 확인",
    "계약서상 보험 자기부담금 재확인"
  ];

  function buildList(id, items, prefix){
    var ul = document.getElementById(id);
    items.forEach(function(text, i){
      var key = prefix + i;
      var li = document.createElement('li');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = key;
      var saved = localStorage.getItem(key);
      if(saved === '1'){ cb.checked = true; li.className = 'checked'; }
      var label = document.createElement('label');
      label.htmlFor = key;
      label.textContent = text;
      cb.addEventListener('change', function(){
        li.classList.toggle('checked', cb.checked);
        localStorage.setItem(key, cb.checked ? '1' : '0');
      });
      li.appendChild(cb);
      li.appendChild(label);
      ul.appendChild(li);
    });
  }
  buildList('checklist-docs', docs, 'de-docs-');
  buildList('checklist-pickup', pickup, 'de-pickup-');
})();
</script>
